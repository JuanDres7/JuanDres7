name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12 horas
  workflow_dispatch:          # botón manual en la pestaña Actions
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generar SVG (claro y oscuro) en naranja y rojo
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23dc2626&color_dots=%23ebedf0,%23fed7aa,%23fdba74,%23fb923c,%23ea580c
            dist/github-snake-dark.svg?color_snake=%23dc2626&color_dots=%23161b22,%237c2d12,%23c2410c,%23ea580c,%23f97316

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
